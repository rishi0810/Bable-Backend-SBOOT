services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b-backend-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      EXTERNAL_API: ${EXTERNAL_API}
      REDIS_HOST: shared-redis
      REDIS_PORT: 6379
    networks:
      - shared-backend-net
    restart: unless-stopped

networks:
  shared-backend-net:
    external: true
